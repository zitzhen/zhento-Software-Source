name: DCO check

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: dco-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dco:
    name: Verify DCO sign-off
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine commit range
        id: range
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            echo "range=${PR_BASE_SHA}..${HEAD_SHA}" >> "$GITHUB_OUTPUT"
          elif [[ "$BEFORE" =~ ^0+$ ]]; then
            if git rev-parse --verify --quiet "origin/${DEFAULT_BRANCH}" >/dev/null; then
              echo "range=origin/${DEFAULT_BRANCH}..${HEAD_SHA}" >> "$GITHUB_OUTPUT"
            else
              root="$(git rev-list --max-parents=0 "$HEAD_SHA" | head -n 1)"
              echo "range=${root}..${HEAD_SHA}" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "range=${BEFORE}..${HEAD_SHA}" >> "$GITHUB_OUTPUT"
          fi

      - name: Check DCO trailers
        env:
          RANGE: ${{ steps.range.outputs.range }}
        run: ./scripts/check-dco.sh "$RANGE"
